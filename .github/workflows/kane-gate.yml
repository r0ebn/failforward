# FailForward Kane gate — the deploy gate.
#
# On every pull request this workflow starts the demo store, runs the full
# Kane loop against it in a real headless browser, posts the verdict as a PR
# comment (with a link to each run), and FAILS the job when Kane fails — so
# the PR cannot merge until the agent fixes the code and Kane passes.
#
# Setup (one time, in the repo settings):
#   1. Add two repository secrets:
#        LT_USERNAME    — your TestMu AI account email
#        LT_ACCESS_KEY  — access key from the TestMu AI dashboard, Settings > Keys
#      (This is the login method the Kane CLI docs prescribe for CI:
#      `kane-cli login --username ... --access-key ...`. There is no single
#      TESTMU_API_KEY for kane-cli.)
#   2. Make "kane-gate" a required status check in branch protection for main,
#      so a red gate actually blocks the merge.
#
# Kane runs consume credits from the TestMu AI account (new accounts get
# 10,000 free credits, valid 30 days).

name: Kane gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  kane-gate:
    name: kane-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the PR
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Log in to Kane CLI
        run: kane-cli login --username "${{ secrets.LT_USERNAME }}" --access-key "${{ secrets.LT_ACCESS_KEY }}"

      - name: Start the FailForward store
        run: |
          npm start > /tmp/failforward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "Store is up."
              exit 0
            fi
            sleep 1
          done
          echo "Store did not come up in 30s."
          cat /tmp/failforward.log
          exit 1

      - name: Run the Kane loop
        id: kane
        continue-on-error: true
        run: node scripts/kane-loop.mjs --base-url http://localhost:3000

      - name: Comment the verdict on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const report = JSON.parse(fs.readFileSync('kane-report.json', 'utf8'));
              const icon = report.overall === 'pass' ? '✅' : report.overall === 'fail' ? '❌' : '⚠️';
              const passed = report.flows.filter(f => f.verdict === 'pass').length;
              const rows = report.flows.map(f => {
                const verdict = f.verdict === 'pass' ? '✅ pass' : f.verdict === 'fail' ? '❌ fail' : '⚠️ error';
                const evidence = f.testUrl ? `[view run](${f.testUrl})` : (f.sessionDir || '—');
                return `| ${f.name} | ${verdict} | ${f.exitCode ?? '—'} | ${f.credits ?? '—'} | ${evidence} |`;
              }).join('\n');
              body = [
                `## ${icon} Kane gate: ${report.overall.toUpperCase()} (${passed}/${report.flows.length} flows passed)`,
                '',
                '| Flow | Verdict | Exit | Credits | Evidence |',
                '| --- | --- | --- | --- | --- |',
                rows,
                '',
                report.overall === 'pass'
                  ? 'Kane signed off. This PR may merge.'
                  : 'Kane did not sign off. Fix the failing flows (see `kane-failure.md` in the run artifacts) and push again.',
              ].join('\n');
            } catch {
              body = [
                '## ⚠️ Kane gate: no report was produced',
                '',
                'The Kane loop did not write `kane-report.json`. Check the workflow log — the run may have failed before any flow started (login, Chrome, or the app failing to start).',
              ].join('\n');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail the job when Kane did not pass
        if: steps.kane.outcome != 'success'
        run: |
          echo "Kane gate is RED: the loop exited non-zero. Merge is blocked."
          echo "Read kane-failure.md, fix the code, and push again."
          exit 1
